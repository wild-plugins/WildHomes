<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Support Banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&family=JetBrains+Mono:wght@500;800&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:180px;background:#0b0e0c}
body{position:relative;overflow:hidden;color:#e5ebe6;font-family:"Geist","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.glow{position:absolute;left:-120px;top:50%;width:760px;height:520px;transform:translateY(-50%);background:radial-gradient(closest-side,rgba(76,195,138,.10),transparent 72%)}
.frame{position:absolute;inset:0;border:4px solid rgba(76,195,138,.78);box-shadow:inset 0 0 50px rgba(76,195,138,.10);z-index:3}
.row{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 56px}
.eyebrow{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:17px;letter-spacing:6px;color:#4cc38a;text-transform:uppercase}
h1{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:10px}
h1 span{color:#4cc38a}
.sub{font-size:19px;color:#98a49b;margin-top:8px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.cta{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:24px;color:#eaf1eb;background:#122e1e;border:2px solid rgba(76,195,138,.6);border-radius:12px;padding:16px 30px;box-shadow:0 0 26px rgba(76,195,138,.16),inset 0 1px 0 rgba(255,255,255,.05);white-space:nowrap}
.cta b{color:#4cc38a;font-weight:500;margin-left:10px}
.by{font-family:"JetBrains Mono",monospace;font-size:16px;color:#98a49b}
.by b{color:#4cc38a;font-weight:500}
</style></head>
<body>
<div class="glow"></div>
<div class="row">
  <div>
    <div class="eyebrow">Support</div>
    <h1>Questions, bugs or <span>ideas?</span></h1>
    <p class="sub">Help, updates and feature requests on the support Discord.</p>
  </div>
  <div class="side">
    <div class="cta">Join the Discord<b>&rarr;</b></div>
    <div class="by">by <b>JustGinoo</b></div>
  </div>
</div>
<div class="frame"></div>
</body></html>

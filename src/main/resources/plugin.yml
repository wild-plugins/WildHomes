name: WildHomes
version: '${project.version}'
main: de.justgino.plugins.wildhomes.WildHomes
description: '${project.description}'
api-version: '26.1'
folia-supported: true
authors: [ JustGino ]
softdepend: [ PlaceholderAPI ]
libraries:
  - org.mariadb.jdbc:mariadb-java-client:${mariadb.version}

permissions:
  wildhomes.use:
    description: Open the homes dialog and teleport to own homes
    default: true
  wildhomes.sethome:
    description: Set and move own homes
    default: true
  wildhomes.delhome:
    description: Delete own homes
    default: true
  wildhomes.rename:
    description: Rename own homes
    default: true
  wildhomes.icon:
    description: Change the icon of own homes
    default: true
  wildhomes.crossserver:
    description: Teleport to own homes on other servers of the network
    default: true
  wildhomes.amount.unlimited:
    description: As many homes as homes.max-slots in config.yml allows
    default: op
  wildhomes.bypass.warmup:
    description: Teleport without the countdown
    default: op
  wildhomes.bypass.cooldown:
    description: Teleport without the cooldown
    default: op
  wildhomes.bypass.world:
    description: Set homes in disabled worlds
    default: op
  wildhomes.admin.view:
    description: /home-admin open - see the homes of other players
    default: op
  wildhomes.admin.teleport:
    description: Teleport to the homes of other players
    default: op
  wildhomes.admin.set:
    description: Set or move homes for other players
    default: op
  wildhomes.admin.rename:
    description: Rename the homes of other players
    default: op
  wildhomes.admin.icon:
    description: Change the icons of other players' homes
    default: op
  wildhomes.admin.delete:
    description: Delete the homes of other players
    default: op
  wildhomes.admin.language:
    description: /home-admin language - change the plugin language
    default: op
  wildhomes.admin.reload:
    description: /home-admin reload
    default: op
  wildhomes.admin:
    description: Every wildhomes.admin node
    default: op
    children:
      wildhomes.admin.view: true
      wildhomes.admin.teleport: true
      wildhomes.admin.set: true
      wildhomes.admin.rename: true
      wildhomes.admin.icon: true
      wildhomes.admin.delete: true
      wildhomes.admin.reload: true
      wildhomes.admin.language: true

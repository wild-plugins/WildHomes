# WildHomes - database
# Changes need a server restart.

# sqlite  - one file in the plugin folder, for a single server
# mariadb - one shared database, needed for cross-server (MySQL works too)
type: "sqlite"

sqlite:
  file: "homes.db"

mariadb:
  host: "localhost"
  port: "3306"
  database: "wildhomes_db"
  username: "wildhomes_name"
  password: ""
  pool-size: 4
  # Extra JDBC parameters, for example sslMode: trust
  properties: {}

# Name of this server, must match velocity.toml (only used for cross-server)
server-name: "survival"

# Must be the same on every server of a network
table-prefix: "wildhomes_"
